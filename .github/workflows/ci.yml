name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: go build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: go test (race + cover)
        env:
          CGO_ENABLED: '1'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          fail_ci_if_error: false

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      # Pinned version so a fresh vuln tool can't silently change behavior.
      # Bump intentionally when you want new checks.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # Exits non-zero (3) on any reachable vulnerability — this gates the
      # job. Failing here blocks the PR.
      - name: govulncheck ./...
        run: govulncheck ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: build bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.bot
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build mcp image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.mcp
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
