name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

      - name: go build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: go test (race + cover)
        env:
          CGO_ENABLED: '1'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: upload coverage
        uses: codecov/codecov-action@v6
        with:
          files: coverage.out
          fail_ci_if_error: false

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
          cache: true

      # Pinned version so a fresh vuln tool can't silently change behavior.
      # Bump intentionally when you want new checks.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # Exits non-zero (3) on any reachable vulnerability — this gates the
      # job. Failing here blocks the PR.
      - name: govulncheck ./...
        run: govulncheck ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: build bot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.bot
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build mcp image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.mcp
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # Run semgrep via `docker run` from the host instead of using
      # GitHub's `container:` field — the semgrep image is Python-
      # based without Node.js, which would break actions/checkout
      # if it executed inside the container. Pinning by image tag.
      #
      # Rulesets:
      #   p/golang         — language-specific anti-patterns
      #   p/security-audit — broad OWASP-style findings
      # --error: non-zero exit on any finding, so this gates the PR.
      - name: semgrep scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src \
            semgrep/semgrep:1.95.0 \
            semgrep --config=p/golang --config=p/security-audit --error --metrics=off

  # osv-scanner reads go.mod (and indirectly go.sum) plus any
  # lockfiles to look up CVE matches in the OSV database.
  # govulncheck already runs in its own job and is stricter about
  # *reachability*; osv-scanner complements it by listing *every*
  # vulnerable dep, reachable or not. Pinned version like govulncheck
  # so a tool update doesn't change behavior.
  #
  # Reusable workflow caller (job-level `uses:`) — no `name:` allowed
  # here per GitHub spec. The reusable needs three permissions:
  # contents:read to scan the tree, security-events:write to upload
  # SARIF to the Security tab, and actions:read because the workflow
  # reads its own metadata at runtime. Caller workflow defaults to
  # `actions: none` so the latter must be granted explicitly.
  osv:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v1.9.1
    with:
      scan-args: |-
        --lockfile=./go.mod
        ./

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history needed — committed secrets can be in any
      # ancestor commit; a shallow checkout would miss them.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
