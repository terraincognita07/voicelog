name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          # Pinned like the other gate tools (govulncheck, semgrep) so a fresh
          # linter release can't silently change the rule set and break an
          # unrelated PR. Bundles staticcheck (the previous standalone step)
          # plus the retired Go Report Card checks — see .golangci.yml. Bump
          # intentionally alongside the go.mod toolchain.
          version: v2.12.2

      - name: go build
        env:
          CGO_ENABLED: '0'
        run: go build ./...

      - name: go test (race + cover)
        env:
          CGO_ENABLED: '1'
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      # codecov no longer allows tokenless upload by default. Token
      # lives in repo secret CODECOV_TOKEN (get it from codecov.io
      # after linking the repo). fail_ci_if_error stays false so a
      # codecov outage doesn't gate the merge — coverage is a
      # signal, not a release gate.
      - name: upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26'
          cache: true

      # Pinned version so a fresh vuln tool can't silently change behavior.
      # Bump intentionally when you want new checks.
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      # Exits non-zero (3) on any reachable vulnerability — this gates the
      # job. Failing here blocks the PR.
      - name: govulncheck ./...
        run: govulncheck ./...

  docker:
    name: docker build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: build bot image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.bot
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build mcp image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.mcp
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Run semgrep via `docker run` from the host instead of using
      # GitHub's `container:` field — the semgrep image is Python-
      # based without Node.js, which would break actions/checkout
      # if it executed inside the container. Pinning by image tag.
      #
      # Rulesets:
      #   p/golang         — language-specific anti-patterns
      #   p/security-audit — broad OWASP-style findings
      # --error: non-zero exit on any finding, so this gates the PR.
      - name: semgrep scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" -w /src \
            semgrep/semgrep:1.95.0 \
            semgrep --config=p/golang --config=p/security-audit --error --metrics=off

  # osv-scanner was tried here as a complement to govulncheck but
  # produces unactionable noise on Go projects: every stdlib patch
  # release ships a fresh batch of OSV-indexed vulns
  # (GO-YYYY-NNNN), and osv-scanner fails on all of them, called
  # AND uncalled, with no reachability filter. govulncheck (the
  # vuln: job above) already covers the same OSV database for Go,
  # but with reachability analysis, so it fails only on vulns the
  # code actually exercises. Adding osv-scanner back would mean
  # maintaining an ignore-list of "current stdlib false positives"
  # that churns every Go release — not worth the gate value.
  #
  # If a non-Go transitive ecosystem appears later (a Node SDK,
  # a Python script, etc.), this is where osv-scanner would slot
  # back in for those lockfiles specifically.

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Full history needed — committed secrets can be in any
      # ancestor commit; a shallow checkout would miss them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
